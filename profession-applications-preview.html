<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'none'; form-action 'none'"><title>BCT — Profession Application Review</title><style>body{font:17px system-ui;background:#f1f7f5;color:#153d3a;margin:0}main{max-width:760px;margin:auto;padding:24px}fieldset{border:1px solid #90b9aa;border-radius:12px;margin:24px 0;padding:20px;background:white}label{display:block;margin:12px 0 6px}input,select,textarea,button{font:inherit;box-sizing:border-box}textarea,select{width:100%;padding:12px;border:1px solid #78998d;border-radius:7px}button{padding:14px;background:#a8e6cf;color:#0a4549;border:1px solid;border-radius:8px;font-weight:bold}p{line-height:1.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}input[type=checkbox]{width:auto}</style><main><h1>Profession Applications</h1><p>Isolated form review — sample answers only. Nothing is sent or saved to an account.</p><form id="applicationForm"><label for="trade">Primary profession</label><select id="trade" name="trade"><option value="electrical">Electrician</option><option value="plumbing">Plumber</option><option value="flooring">Flooring — existing general form</option></select><label><input type="checkbox" name="contractorNetworkRole" value="electrical"> Also apply as Electrician</label><label><input type="checkbox" name="contractorNetworkRole" value="plumbing"> Also apply as Plumber</label><div id="questions"></div><button type="submit">Review Answers Locally</button><button type="reset">Clear Sample Answers</button></form><p id="status" role="status"></p><pre id="review"></pre></main><script src="bct-profession-applications.js"></script><script>const f=document.getElementById('applicationForm');BCTProfessionApplications.mount(f);f.addEventListener('submit',e=>{e.preventDefault();try{document.getElementById('review').textContent=JSON.stringify(BCTProfessionApplications.read(f),null,2);document.getElementById('status').textContent='Local review only. No application was submitted.'}catch(error){document.getElementById('status').textContent=error.message}});f.addEventListener('reset',()=>{document.getElementById('review').textContent='';document.getElementById('status').textContent=''});</script></html>
