name: V46 Apply PWA Cold Launch Source Fix

on:
  push:
    paths:
      - '.github/workflows/v46-apply-pwa-cold-launch-source-fix.yml'

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current V46 main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact cold-launch source repair
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          old = "function setAuthShell(session){if(publicShareMode)session=null;document.documentElement.classList.add('bct-session-resolved');const signedIn=!!session?.user;document.body.classList.toggle('bct-authenticated',signedIn);document.body.classList.toggle('bct-signed-out',!signedIn);if(signedIn){document.body.classList.remove('bct-entry-client','bct-entry-contractor','bct-entry-admin');clearSignedOutIsolation();}else if(!entryIntent){document.body.classList.remove('bct-entry-client','bct-entry-contractor','bct-entry-admin');setVisibleView('home');document.querySelectorAll('header nav').forEach(n=>n.style.setProperty('display','none','important'));}}"
          new = "function setAuthShell(session){if(publicShareMode)session=null;document.documentElement.classList.add('bct-session-resolved');const hasSession=!!session?.user;const publicHome=!entryIntent&&!document.body.classList.contains('bct-portal-entered')&&!document.body.classList.contains('bct-home-signup')&&!document.body.classList.contains('bct-contractor-signup')&&(!location.hash||location.hash==='#home');const signedIn=hasSession&&!publicHome;document.body.classList.toggle('bct-authenticated',signedIn);document.body.classList.toggle('bct-signed-out',!signedIn);if(signedIn){document.body.classList.remove('bct-entry-client','bct-entry-contractor','bct-entry-admin');clearSignedOutIsolation();}else if(!entryIntent){document.body.classList.remove('bct-entry-client','bct-entry-contractor','bct-entry-admin');setVisibleView('home');document.querySelectorAll('header nav').forEach(n=>n.style.setProperty('display','none','important'));}}"

          count = html.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one V46 auth-shell source function, found {count}')
          html = html.replace(old, new, 1)
          index_path.write_text(html, encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          old_cache = "const CACHE_NAME='bct-portal-shell-v33-public-home-auth-shell';"
          new_cache = "const CACHE_NAME='bct-portal-shell-v34-source-public-home';"
          if old_cache not in sw:
              raise SystemExit('Expected V33 service-worker cache marker was not found')
          sw = sw.replace(old_cache, new_cache, 1)

          start = sw.find('const BCT_AUTH_SHELL_SOURCE=`')
          end = sw.find('const BCT_SIGNUP_HOME_NAV_PATCH=`')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Expected temporary service-worker auth-shell patch block was not found')
          sw = sw[:start] + sw[end:]

          runtime_call = '      patched=patchPublicHomeAuthShell(patched);\n'
          if runtime_call not in sw:
              raise SystemExit('Expected temporary runtime auth-shell patch call was not found')
          sw = sw.replace(runtime_call, '', 1)
          sw_path.write_text(sw, encoding='utf-8')

          test_path = Path('tests/v46-pwa-cold-launch-source.mjs')
          test_path.write_text(r'''import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const html = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('service-worker.js', 'utf8');

          const sourceGuard = "const hasSession=!!session?.user;const publicHome=!entryIntent&&!document.body.classList.contains('bct-portal-entered')&&!document.body.classList.contains('bct-home-signup')&&!document.body.classList.contains('bct-contractor-signup')&&(!location.hash||location.hash==='#home');const signedIn=hasSession&&!publicHome;";
          assert.equal(html.includes(sourceGuard), true, 'index.html must keep restored sessions visually signed out on public Home');
          assert.equal(sw.includes('patchPublicHomeAuthShell'), false, 'service worker must not rewrite auth-shell source at runtime');
          assert.equal(sw.includes("bct-portal-shell-v34-source-public-home"), true, 'service worker cache generation must match source-level Home fix');

          function authenticated({hasSession, entryIntent=null, portalEntered=false, homeSignup=false, contractorSignup=false, hash=''}) {
            const publicHome = !entryIntent && !portalEntered && !homeSignup && !contractorSignup && (!hash || hash === '#home');
            return hasSession && !publicHome;
          }

          assert.equal(authenticated({hasSession:true}), false, 'cold standalone Home launch with restored session must remain public');
          assert.equal(authenticated({hasSession:true, hash:'#home'}), false, '#home with restored session must remain public');
          assert.equal(authenticated({hasSession:true, entryIntent:'client'}), true, 'deliberate Client portal entry may use restored session');
          assert.equal(authenticated({hasSession:true, entryIntent:'contractor'}), true, 'deliberate Contractor portal entry may use restored session');
          assert.equal(authenticated({hasSession:true, entryIntent:'admin'}), true, 'deliberate Admin portal entry may use restored session');
          assert.equal(authenticated({hasSession:true, portalEntered:true}), true, 'already-entered portal may remain authenticated');

          console.log('V46 PWA cold-launch source regression: PASS');
          ''', encoding='utf-8')

      - name: Run targeted cold-launch regression
        run: node tests/v46-pwa-cold-launch-source.mjs

      - name: Commit exact source repair
        shell: bash
        run: |
          if git diff --quiet -- index.html service-worker.js tests/v46-pwa-cold-launch-source.mjs; then
            echo 'No source repair changes were required.'
            exit 0
          fi
          git config user.name 'BCT-Renovations'
          git config user.email 'myproject@bctrenovations.com'
          git add index.html service-worker.js tests/v46-pwa-cold-launch-source.mjs
          git commit -m 'Fix V46 PWA cold launch at source'
          git push origin HEAD:main
