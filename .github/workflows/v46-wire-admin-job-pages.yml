name: V46 Wire Admin Job Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v46-wire-admin-job-pages.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire guarded Admin job-page loader
        shell: python
        run: |
          from pathlib import Path
          path = Path('bct-admin-sections.js')
          text = path.read_text()
          marker = '/bct-admin-job-pages.js?v=20260930-1'
          if marker not in text:
              text += '''\n\n/* BCT V46 guarded Admin job page-flip loader. */\n(function(){\n  if(document.querySelector('script[data-bct-admin-job-pages]'))return;\n  const script=document.createElement('script');\n  script.src='/bct-admin-job-pages.js?v=20260930-1';\n  script.dataset.bctAdminJobPages='1';\n  script.defer=true;\n  document.head.appendChild(script);\n})();\n'''
              path.write_text(text)
      - name: Commit wiring
        run: |
          if git diff --quiet -- bct-admin-sections.js; then
            echo "Admin job-page loader already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bct-admin-sections.js
          git commit -m "Wire paged Admin job management"
          git push
