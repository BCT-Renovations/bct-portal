# One-time trigger for guarded Admin section wiring.
name: V46 Wire Admin Sections Once

on:
  push:
    paths:
      - '.github/workflows/v46-wire-admin-sections.yml'

permissions:
  contents: write

jobs:
  wire-admin-sections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current V46 main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire isolated Admin section organizer
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          tag='<script src="/bct-admin-sections.js?v=20260930-1"></script>'
          if tag in html:
              print('Admin section organizer is already wired.')
          else:
              marker='</body>\n</html>'
              count=html.count(marker)
              if count != 1:
                  raise SystemExit(f'Expected exactly one closing body/html marker, found {count}')
              html=html.replace(marker,tag+'\n</body>\n</html>',1)
              path.write_text(html,encoding='utf-8')

      - name: Run Admin section regression
        run: node tests/v46-admin-section-navigation.mjs

      - name: Run current launch smoke
        run: node scripts/bct-launch-smoke-current.mjs

      - name: Commit exact Admin wiring
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index wiring change required.'
            exit 0
          fi
          git config user.name 'BCT-Renovations'
          git config user.email 'myproject@bctrenovations.com'
          git add index.html
          git commit -m 'Wire V46 Admin section navigation'
          git push origin HEAD:main
