name: BCT V46 Smoke Checks

on:
  push:
    branches: [main, feature/v46-field-controls-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Run V46 smoke suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Source integrity guard
        run: node scripts/bct-source-integrity-smoke-current.mjs

      - name: Launch smoke
        run: node scripts/bct-launch-smoke-current.mjs

      - name: PWA cold-launch restored-session regression
        run: node tests/v46-pwa-cold-launch-source.mjs

      - name: Admin section navigation regression
        run: node tests/v46-admin-section-navigation.mjs

      - name: Launch dry run smoke
        run: node scripts/bct-launch-dry-run-smoke.mjs

      - name: Role visibility smoke
        run: node scripts/bct-role-visibility-smoke.mjs

      - name: Submission lockout smoke
        run: node scripts/bct-submission-lock-smoke.mjs

      - name: AI estimating smoke
        run: node scripts/bct-ai-estimating-smoke.mjs

      - name: Contractor onboarding smoke
        run: node scripts/bct-contractor-onboarding-smoke.mjs

      - name: Contractor safety UI smoke
        run: node scripts/bct-contractor-safety-ui-smoke.mjs

      - name: Safety training smoke
        run: node scripts/bct-safety-training-smoke.mjs

      - name: Automation health smoke
        run: node scripts/bct-automation-health-smoke.mjs

      - name: Phase 1 privacy and communications smoke
        run: node scripts/bct-phase1-privacy-communications-smoke.mjs

      - name: Phase 1 workflow boundary smoke
        run: node scripts/bct-phase1-workflow-boundary-smoke.mjs

      - name: V46 regression syntax preflight
        run: |
          for f in tests/v46-*.mjs; do node --check "$f"; done

      - name: V46 field controls regression bundle
        run: |
          node tests/v46-sql-delimiter-regression.mjs
          node tests/v46-migration-static-integrity-regression.mjs
          node tests/v46-project-readiness-regression.mjs
          node tests/v46-field-control-lifecycle-regression.mjs
          node tests/v46-execution-blocker-regression.mjs
          node tests/v46-operational-closeout-regression.mjs
          node tests/v46-financial-protection-regression.mjs
          node tests/v46-trade-handoff-regression.mjs
          node tests/v46-crew-arrival-escalation-regression.mjs
          node tests/v46-damage-responsibility-regression.mjs
          node tests/v46-whos-coming-attendance-regression.mjs
          node tests/v46-contractor-decision-escalation-regression.mjs
          node tests/v46-homeowner-composition-regression.mjs
          node tests/v46-property-manager-priority-regression.mjs
          node tests/v46-field-protection-checklists-regression.mjs
          node tests/v46-delivery-scheduling-regression.mjs
          node tests/v46-contractor-abandonment-replacement-regression.mjs
