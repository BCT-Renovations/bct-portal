name: V46 Protect Portal Entry From Late Auth Override

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v46-fix-mutation-loop.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep chosen signed-out portal open during late auth callbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(signedIn){document.body.classList.remove('bct-entry-client','bct-entry-contractor','bct-entry-admin');clearSignedOutIsolation();}else if(!entryIntent){document.body.classList.remove('bct-entry-client','bct-entry-contractor','bct-entry-admin');setVisibleView('home');document.querySelectorAll('header nav').forEach(n=>n.style.setProperty('display','none','important'));}"
          new="if(signedIn){document.body.classList.remove('bct-entry-client','bct-entry-contractor','bct-entry-admin');clearSignedOutIsolation();}else if(document.body.classList.contains('bct-portal-entered')){if(document.body.classList.contains('bct-entry-client'))setVisibleView('customer');else if(document.body.classList.contains('bct-entry-contractor'))setVisibleView(document.body.classList.contains('bct-contractor-signup')?'apply':'status');else if(document.body.classList.contains('bct-entry-admin'))setVisibleView('admin-login');}else if(!entryIntent){document.body.classList.remove('bct-entry-client','bct-entry-contractor','bct-entry-admin');setVisibleView('home');document.querySelectorAll('header nav').forEach(n=>n.style.setProperty('display','none','important'));}"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one auth-shell override target, found {count}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit late-auth portal protection
        run: |
          git config user.name 'BCT-Renovations'
          git config user.email 'myproject@bctrenovations.com'
          git add index.html
          git diff --cached --check
          git commit -m 'V46 keep selected portal open during late auth callbacks'
          git push origin main
