name: V46 Fix Contractor Signup Auth Override

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v46-fix-mutation-loop.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep signed-out contractor application open
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="try{window.bctHandlePortalAuthState?.(_event,session)}catch(_){};\n   if(_event==='SIGNED_OUT'){"
          new="try{window.bctHandlePortalAuthState?.(_event,session)}catch(_){};\n   // Do not let a late signed-out/initial-session callback knock a contractor out of the application they just opened.\n   if(!session && document.body.classList.contains('bct-contractor-signup')){\n     setAuthShell(null);\n     setVisibleView('apply');\n     document.getElementById('view-apply')?.classList.remove('hidden','bct-signedout-hidden');\n     return;\n   }\n   if(_event==='SIGNED_OUT'){"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one auth-state insertion point, found {count}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit contractor signup auth fix
        run: |
          git config user.name 'BCT-Renovations'
          git config user.email 'myproject@bctrenovations.com'
          git add index.html
          git diff --cached --check
          git commit -m 'V46 keep contractor signup open during signed-out auth callbacks'
          git push origin main
