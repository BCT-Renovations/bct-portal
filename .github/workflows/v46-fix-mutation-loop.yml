name: V46 Fix Contractor Signup Visibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v46-fix-mutation-loop.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Exempt active contractor application from generic signed-out view gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="body:not(.bct-authenticated) main>.view:not(#view-home):not(#view-admin-login):not(#view-password-request):not(#view-password-reset):not(#view-customer):not(#view-status){display:none!important}"
          new="body:not(.bct-authenticated) main>.view:not(#view-home):not(#view-admin-login):not(#view-password-request):not(#view-password-reset):not(#view-customer):not(#view-status):not(#view-apply){display:none!important}"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one signed-out view gate, found {count}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit contractor application visibility fix
        run: |
          git config user.name 'BCT-Renovations'
          git config user.email 'myproject@bctrenovations.com'
          git add index.html
          git diff --cached --check
          git commit -m 'V46 allow signed-out contractor application view to display'
          git push origin main
