name: BCT V46 iPhone Portal Connection

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'bct-admin-mobile-fix.js'
      - 'bct-client-translation-fix.js'
      - 'manifest.webmanifest'
      - 'tests/v46-iphone-portal-connection.mjs'
      - 'tests/v46-iphone-homeowner-wizard.mjs'
      - 'tests/v46-iphone-admin-controls.mjs'
      - 'tests/v46-iphone-client-translation.mjs'
      - '.github/workflows/v46-iphone-portal-connection.yml'

permissions:
  contents: read

jobs:
  iphone-webkit-portals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps webkit
      - name: Test live V46 portal connections in WebKit
        env:
          BCT_URL: https://bctsecureadminv45emailfieldfixed.vercel.app
        run: node tests/v46-iphone-portal-connection.mjs
      - name: Test live V46 homeowner 7-step wizard in WebKit
        env:
          BCT_URL: https://bctsecureadminv45emailfieldfixed.vercel.app
        run: node tests/v46-iphone-homeowner-wizard.mjs
      - name: Test live V46 Admin controls and Spanish translation in WebKit
        env:
          BCT_URL: https://bctsecureadminv45emailfieldfixed.vercel.app
        run: node tests/v46-iphone-admin-controls.mjs
      - name: Test live V46 Client Portal Spanish translation in WebKit
        env:
          BCT_URL: https://bctsecureadminv45emailfieldfixed.vercel.app
        run: node tests/v46-iphone-client-translation.mjs
