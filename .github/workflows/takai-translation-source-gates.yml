name: Takai Translation Source Gates
on:
  push:
    branches:
      - fix/takai-translation-audit-20261015
  workflow_dispatch:
jobs:
  translation-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Takai translation source checks
        run: node tests/takai-translation-source-regression.mjs
      - name: Verify Agent BCT nine-language contract
        run: node --test tests/agent-bct/languages.test.js
      - name: Verify gallery translation integration
        run: node tests/v46-gallery-image-text-translation.mjs
      - name: Validate browser regression test syntax
        run: |
          node --check tests/v46-iphone-portal-connection.mjs
          node --check tests/v46-iphone-homeowner-wizard.mjs
          node --check tests/v46-iphone-admin-controls.mjs

  browser-iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      # Latest confirmed READY isolated deployment; never test the protected Live domain.
      - name: Exercise isolated preview on iPhone WebKit
        env:
          BCT_URL: https://bct-v46-isolated-preview-if510rf57-typerry1972-1855.vercel.app
        run: node tests/v46-iphone-portal-connection.mjs
