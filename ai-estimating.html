<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCT AI Estimating</title><style>body{font-family:Arial;background:#0f172a;color:#f8fafc;margin:0}.w{max-width:1100px;margin:auto;padding:18px}.c{background:#1f2937;border:1px solid #334155;border-radius:14px;padding:16px;margin:14px 0}.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #475569;background:#0b1220;color:#fff}button{background:#38bdf8;color:#062033;font-weight:800;cursor:pointer}.ok{background:#22c55e}.bad{background:#ef4444;color:#fff}.muted{color:#94a3b8}.notice{padding:12px;background:#082f49;border-radius:10px}.item{border:1px solid #475569;padding:12px;border-radius:10px;margin:10px 0}@media(max-width:700px){.g{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>BCT AI Estimating</h1><p class="muted">BCT Admin only. AI creates drafts only. Every estimate requires manual BCT review and approval before the homeowner can see it.</p><div id="auth" class="notice">Checking BCT Admin session…</div><div class="c"><label>Project</label><select id="project"><option value="">Choose project</option></select><div class="g"><button id="generate">Generate AI Draft</button><button id="reload">Reload</button></div></div><div id="status"></div><div id="workspace"></div><p><a href="/" style="color:#7dd3fc">Back to BCT Portal</a></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U='https://onpqykpikxbbypfvmtin.supabase.co',K='sb_publishable_JToQ3bPaJql-xHq-iyM0bg_Fweenyfh',s=supabase.createClient(U,K),$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=x=>'$'+Number(x||0).toFixed(2);const AI_PROJECT_DRAFT_LIMIT=2,AI_DAILY_DRAFT_LIMIT=3;let state=null,est=null,items=[];
async function rpc(n,a={}){const r=await s.rpc(n,a);if(r.error)throw r.error;return r.data}async function invoke(action,b={}){const r=await s.functions.invoke('bct-ai-estimate',{body:{action,...b}});if(r.error)throw r.error;if(r.data?.ok===false)throw Error(r.data.error);return r.data?.data}
function aiRunDay(x){return String(x?.created_at||x?.started_at||'').slice(0,10)}
function aiCostGuardMessage(runs=[]){return 'AI Cost Controls: max '+AI_PROJECT_DRAFT_LIMIT+' draft generations per project review cycle and '+AI_DAILY_DRAFT_LIMIT+' per admin day until AI/API billing is confirmed. AI drafts stay pending BCT review and never auto-approve customer-facing estimates.'}
function enforceAiCostGuard(runs=[]){const today=new Date().toISOString().slice(0,10),todayRuns=runs.filter(r=>aiRunDay(r)===today);if(runs.length>=AI_PROJECT_DRAFT_LIMIT)throw Error('Draft limit reached for this project. Edit/recalculate the current draft or have BCT Admin clear the review cycle.');if(todayRuns.length>=AI_DAILY_DRAFT_LIMIT)throw Error('Daily AI draft limit reached. Confirm provider billing/spend controls before generating more drafts.')}
function msg(x){$('status').innerHTML='<div class="notice">'+esc(x)+'</div>'}
async function boot(){const u=await s.auth.getUser();if(!u.data.user)throw Error('Sign in through the BCT Admin portal first.');if(await rpc('is_bct_admin')!==true)throw Error('BCT Admin access required.');$('auth').innerHTML='<b>✓ BCT Admin authenticated</b><br>'+esc(u.data.user.email);const a=await rpc('bct_frontend_admin_state'),ps=a.projects||[];$('project').innerHTML='<option value="">Choose project</option>'+ps.map(p=>'<option value="'+esc(p.project_id)+'">'+esc(p.project_number)+' — '+esc((p.services||[]).join(', '))+'</option>').join('')}
async function load(){const pid=$('project').value;if(!pid){$('workspace').innerHTML='';return}state=await invoke('state',{project_id:pid});const run=(state.runs||[])[0];if(!run){est=null;items=[];render();return}let a=await s.from('bct_estimates').select('*').eq('id',run.estimate_id).single();if(a.error)throw a.error;est=a.data;a=await s.from('bct_estimate_items').select('*').eq('estimate_id',est.id).order('sort_order');if(a.error)throw a.error;items=a.data||[];render()}
function itemHtml(i,n){return '<div class="item"><div class="g"><div><label>Category</label><select id="t'+i.id+'"><option '+(i.item_type==='material'?'selected':'')+' value="material">Material</option><option '+(i.item_type==='labor'?'selected':'')+' value="labor">Labor</option><option '+(i.item_type==='other'?'selected':'')+' value="other">Other</option></select></div><div><label>Customer Description</label><input id="cd'+i.id+'" value="'+esc(i.customer_description||i.description)+'"></div><div><label>BCT Description</label><input id="d'+i.id+'" value="'+esc(i.description)+'"></div><div><label>Unit</label><input id="u'+i.id+'" value="'+esc(i.unit)+'"></div><div><label>Quantity</label><input id="q'+i.id+'" type="number" step=".001" min="0" value="'+Number(i.quantity)+'"></div><div><label>Internal Unit Cost</label><input id="c'+i.id+'" type="number" step=".01" min="0" value="'+Number(i.internal_unit_cost||0)+'"></div><div><label>Customer Unit Price</label><input id="p'+i.id+'" type="number" step=".01" min="0" value="'+Number(i.unit_price||0)+'"></div><div><label>BCT Internal Notes</label><input id="n'+i.id+'" value="'+esc(i.internal_notes||'')+'"></div></div><p class="muted">Internal cost '+money(i.internal_cost_total)+' • Customer line '+money(i.line_total)+'</p><button onclick="saveItem(\''+i.id+'\','+n+')">Save Line & Recalculate</button></div>'}
function render(){const guard='<div class="notice"><b>AI Cost Controls</b><br>'+esc(aiCostGuardMessage(state?.runs||[]))+'</div>';if(!est){$('workspace').innerHTML=guard+'<div class="c">No AI draft yet. Generate one to begin BCT review.</div>';return}const run=(state.runs||[]).find(x=>x.estimate_id===est.id)||{};$('workspace').innerHTML=guard+'<div class="c"><h2>'+esc(est.estimate_number||'Draft Estimate')+' — '+esc(est.status)+'</h2><div class="g"><div>Internal Cost<h2>'+money(est.internal_cost_subtotal)+'</h2></div><div>Customer Subtotal<h2>'+money(est.subtotal)+'</h2></div><div>BCT Markup<h2>'+money(est.markup_amount)+' ('+Number(est.markup_percent||0).toFixed(2)+'%)</h2></div><div>Customer Total<h2>'+money(est.total)+'</h2></div></div><label>Detailed Scope / AI Summary</label><textarea id="scope">'+esc(est.ai_summary||'')+'</textarea><label>Assumptions / Measurements</label><textarea id="assume">'+esc(est.assumptions||'')+'</textarea><label>BCT Internal Notes</label><textarea id="notes">'+esc(est.internal_notes||'')+'</textarea><label>Discount %</label><input id="discount" type="number" min="0" step=".01" value="'+Number(est.discount_percent||0)+'"><button onclick="saveEstimate()">Save & Recalculate</button><p class="muted">AI run '+esc(run.engine_version||'')+' — '+esc(run.status||'')+'. AI cannot approve or release this estimate.</p></div><div class="c"><h2>Materials, Labor & Other Costs</h2>'+items.map(itemHtml).join('')+'<button onclick="addItem()">+ Add Line Item</button></div><div class="c"><h2>Manual Approval Gate</h2>'+(run.status==='review_required'?'<button onclick="reviewRun(\''+run.id+'\',\'approve\')">Complete BCT Review</button><button class="bad" onclick="reviewRun(\''+run.id+'\',\'reject\')">Reject AI Draft</button>':'')+(est.status==='review'?'<button class="ok" onclick="approve()">Manually Approve & Release to Homeowner</button>':'')+(est.status==='sent'?'<div class="notice"><b>✓ Manually approved by BCT and released.</b> Internal cost/markup fields are excluded from the homeowner estimate-item feed.</div>':'')+'</div>'}
async function saveEstimate(){try{msg('Saving…');await invoke('update_estimate',{estimate_id:est.id,scope_summary:$('scope').value,assumptions:$('assume').value,internal_notes:$('notes').value,discount_percent:Number($('discount').value||0)});await load();msg('Saved and recalculated.')}catch(e){msg(e.message)}}
async function saveItem(id,n){try{await invoke('save_item',{estimate_id:est.id,item_id:id,item_type:$('t'+id).value,description:$('d'+id).value,customer_description:$('cd'+id).value,quantity:Number($('q'+id).value||0),unit:$('u'+id).value,internal_unit_cost:Number($('c'+id).value||0),customer_unit_price:Number($('p'+id).value||0),internal_notes:$('n'+id).value,sort_order:n+1});await load();msg('Line saved and totals recalculated.')}catch(e){msg(e.message)}}
async function addItem(){try{await invoke('save_item',{estimate_id:est.id,item_type:'other',description:'New BCT line item',customer_description:'Project line item',quantity:1,unit:'ea',internal_unit_cost:0,customer_unit_price:0,sort_order:items.length+1});await load()}catch(e){msg(e.message)}}
async function reviewRun(id,decision){try{await invoke('review',{run_id:id,decision,notes:'Reviewed in BCT AI Estimating workspace'});await load();msg(decision==='approve'?'AI draft moved to BCT manual review.':'AI draft rejected.')}catch(e){msg(e.message)}}
async function approve(){if(!confirm('Release this estimate to the homeowner? This is the manual BCT approval step.'))return;try{await invoke('approve_customer',{estimate_id:est.id});await load();msg('Estimate manually approved and released.')}catch(e){msg(e.message)}}
$('generate').onclick=async()=>{if(!$('project').value)return msg('Choose a project first.');try{const current=await invoke('state',{project_id:$('project').value});enforceAiCostGuard(current.runs||[]);if(!confirm(aiCostGuardMessage(current.runs||[])+' Generate one internal draft now?'))return;msg('Generating AI-assisted draft…');await invoke('generate',{project_id:$('project').value});await load();msg('Draft generated. It is not approved or customer-visible.')}catch(e){msg(e.message)}};$('reload').onclick=()=>load().catch(e=>msg(e.message));$('project').onchange=()=>load().catch(e=>msg(e.message));boot().catch(e=>msg(e.message));
</script></body></html>
